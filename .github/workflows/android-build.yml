name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# AGP 9.1.x requires Gradle 9.1.0+ and JDK 17.
env:
  GRADLE_VERSION: "9.1.0"

jobs:
  build:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "tools platform-tools platforms;android-36 build-tools;36.0.0"

      # Provisions Gradle itself, so the project does not need a committed
      # gradlew/gradle-wrapper.jar to be buildable in CI.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      # Generates gradlew/gradlew.bat/gradle-wrapper.jar so contributors can
      # build locally too. Safe to re-run; it just refreshes the wrapper files.
      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x ./gradlew

      # Provides the real Gemini API key at build time without ever
      # committing it to the repo. If the secret isn't set, the Secrets
      # Gradle Plugin automatically falls back to .env.example, so the
      # build still succeeds (the app just won't have a working key).
      - name: Create local .env file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          else
            echo "GEMINI_API_KEY sekret o'rnatilmagan — .env.example fallback ishlatiladi."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          
