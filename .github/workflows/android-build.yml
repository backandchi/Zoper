name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# AGP 9.1.1 requires Gradle 9.3.1+ and JDK 17.
env:
  GRADLE_VERSION: "9.3.1"

jobs:
  build:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Looks for a .zip anywhere in the repo (e.g. jarvis-ai-fixed.zip),
      # unzips it, and figures out where the real Gradle project root is
      # (handles both "zip contains one wrapper folder" and "zip contains
      # the project files directly" layouts). Everything after this step
      # runs inside that resolved folder.
      - name: Locate & extract project zip
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No .zip file found in the repository. Nothing to build."
            exit 1
          fi
          echo "📦 Found zip: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          # If the zip extracted into exactly one top-level folder (no loose
          # files), treat that folder as the project root. Otherwise the
          # extracted folder itself is the project root.
          TOPDIRS=$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOPFILES=$(find extracted -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$TOPDIRS" -eq 1 ] && [ "$TOPFILES" -eq 0 ]; then
            INNER_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d)
            PROJECT_DIR="$INNER_DIR"
          else
            PROJECT_DIR="extracted"
          fi

          # Sanity check: make sure this actually looks like an Android/Gradle project.
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "❌ Could not find settings.gradle(.kts) inside the zip at $PROJECT_DIR"
            find extracted -maxdepth 3
            exit 1
          fi

          echo "✅ Project root resolved to: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "tools platform-tools platforms;android-36 build-tools;36.0.0"

      # Provisions Gradle itself, so the project does not need a committed
      # gradlew/gradle-wrapper.jar to be buildable in CI.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      # Generates gradlew/gradlew.bat/gradle-wrapper.jar so contributors can
      # build locally too. Safe to re-run; it just refreshes the wrapper files.
      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x ./gradlew

      # Provides the real Gemini API key at build time without ever
      # committing it to the repo. If the secret isn't set, the Secrets
      # Gradle Plugin automatically falls back to .env.example, so the
      # build still succeeds (the app just won't have a working key).
      - name: Create local .env file
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          else
            echo "GEMINI_API_KEY sekret o'rnatilmagan — .env.example fallback ishlatiladi."
          fi

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore
          
