name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        mkdir -p project_source
        unzip -q "*.zip" -d project_source || unzip -q "jarvis-ai (1).zip" -d project_source

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build APK
      run: |
        # gradlew faylini izlaymiz
        GRADLEW_PATH=$(find project_source -name gradlew -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "XATOLIK: gradlew fayli topilmadi! Zip ichidagi fayllar:"
          ls -R project_source
          exit 1
        fi
        
        WORK_DIR=$(dirname "$GRADLEW_PATH")
        echo "Loyiha ildiz papkasi: $WORK_DIR"
        cd "$WORK_DIR"
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: project_source/**/app/build/outputs/apk/debug/*.apk
        
