name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip project
      run: |
        mkdir -p project_source
        unzip -q "*.zip" -d project_source || unzip -q "jarvis-ai (1).zip" -d project_source

    - name: Fix Keystore, Root Structure and Build APK
      run: |
        # Asosiy ildiz papkani topamiz
        APP_PATH=$(find project_source -name "app" -type d | head -n 1)
        ROOT_DIR=$(dirname "$APP_PATH")
        echo "Loyiha ildiz papkasi: $ROOT_DIR"
        cd "$ROOT_DIR"

        # Tushib qolgan debug.keystore faylini avtomatik yaratamiz
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

        # Yetishmayotgan settings.gradle.kts bo'lmasa yaratamiz
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo 'include(":app")' > settings.gradle.kts
        fi

        # Yetishmayotgan root build.gradle.kts bo'lmasa yaratamiz
        if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
          echo '// Root build file' > build.gradle.kts
        fi

        # Gradle Wrapper yaratamiz
        gradle wrapper

        # APK yig'ish
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: project_source/**/app/build/outputs/apk/debug/*.apk
        
