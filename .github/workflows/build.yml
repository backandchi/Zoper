name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip project
      run: |
        mkdir -p project_source
        unzip -q "*.zip" -d project_source || unzip -q "jarvis-ai.zip" -d project_source

    - name: Fix Compatibility and Build APK
      run: |
        APP_PATH=$(find project_source -name "app" -type d | head -n 1)
        ROOT_DIR=$(dirname "$APP_PATH")
        cd "$ROOT_DIR"

        # Keystore yaratish
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

        # Soxta google-services.json yaratish (Firebase xatosini yo'qotish uchun)
        if [ -d "app" ] && [ ! -f "app/google-services.json" ]; then
          echo '{"project_info":{"project_number":"123","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.example.app"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
        fi

        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo 'include(":app")' > settings.gradle.kts
        fi

        if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
          echo '// Root build file' > build.gradle.kts
        fi

        gradle wrapper
        chmod +x gradlew

        # Kotlin versiyasini eski Compose plagini mos keladigan 1.9.23 ga tushiramiz
        ./gradlew assembleDebug -Pkotlin.version=1.9.23 -Porg.jetbrains.kotlin.compiler.version=1.9.23

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: project_source/**/app/build/outputs/apk/debug/*.apk
