name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip project
      run: |
        mkdir -p project_source
        unzip -q "*.zip" -d project_source || unzip -q "jarvis-ai (1).zip" -d project_source

    - name: Fix Missing Gradle Wrapper and Build APK
      run: |
        # App papkasi joylashgan ildiz joyni topamiz
        APP_DIR=$(dirname $(find project_source -name "build.gradle*" -o -name "settings.gradle*" | head -n 1))
        echo "Loyiha ildiz papkasi: $APP_DIR"
        cd "$APP_DIR"

        # Tushib qolgan Gradle Wrapper fayllarini avtomatik yaratamiz
        gradle wrapper

        # Build huquqini beramiz va APK yig'amiz
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: project_source/**/app/build/outputs/apk/debug/*.apk
        
